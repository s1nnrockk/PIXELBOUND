name: Build PIXELBOUND
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export Windows
        run: godot --headless --path . --export-release "Windows Desktop" PIXELBOUND.exe
      - name: Export Linux
        run: godot --headless --path . --export-release "Linux" PIXELBOUND.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: PIXELBOUND-build
          path: |
            PIXELBOUND.exe
            PIXELBOUND.x86_64
