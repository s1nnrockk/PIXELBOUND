name: Build PIXELBOUND
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -name 'Godot_v4.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Import and validate project
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" import.log
      - name: Export Windows executable
        run: |
          set -o pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release "Windows Desktop" build/PIXELBOUND.exe 2>&1 | tee export.log
          ! grep -E "ERROR:|Export failed|Failed to" export.log
          test -s build/PIXELBOUND.exe
          test -s build/PIXELBOUND.pck
          test "$(stat -c%s build/PIXELBOUND.exe)" -gt 1000000
      - uses: actions/upload-artifact@v4
        with:
          name: PIXELBOUND-Windows
          path: |
            build/PIXELBOUND.exe
            build/PIXELBOUND.pck
          if-no-files-found: error
